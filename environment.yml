# Versions used for the results in the paper (Python 3.13, Linux x86_64).
name: dyndisc
channels: [conda-forge]
dependencies:
  - python=3.13
  - numpy=2.5.3
  - scipy=1.18.1
  - pandas=3.0.5
  - scikit-learn=1.9.1
  - statsmodels=0.15.0
  - matplotlib=3.11.2
  - pymc=6.3.2
  - pytensor=3.3.6
  - arviz=1.3.0
  - patsy=1.0.3
